<!DOCTYPE html>
<html lang="en">
  <head>
    <title>LEADERBOARD</title>
    <style>
      .list {
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      .list-header,
      .list-row {
        display: flex;
        padding: 10px;
        font-weight: bold;
      }

      .list-row {
        background: white;
      }

      .list-header div,
      .list-row div {
        flex: 1;
        padding: 10px;
        text-align: left;
      }
    </style>
  </head>

  <body>
    <h1>LEADERBOARD</h1>

    <form onsubmit="event.preventDefault();onFormSubmit();" autocomplete="off">
      <div>
        <label>First Name</label>
        <input type="text" name="firstName" id="firstName" required />
      </div>
      <div>
        <label>Last Name</label>
        <input type="text" name="lastName" id="lastName" required />
      </div>
      <div>
        <label>Country</label>
        <input type="text" name="country" id="country" required />
      </div>
      <div>
        <label>Score</label>
        <input type="number" name="score" id="score" required />
      </div>
      <div class="form-action-buttons">
        <input type="submit" value="Add Player" />
      </div>
    </form>

    <div class="list" id="playerList">
      <div class="list-header">
        <div class="list-item"><strong>First Name</strong></div>
        <div class="list-item"><strong>Last Name</strong></div>
        <div class="list-item"><strong>Country</strong></div>
        <div class="list-item"><strong>Score</strong></div>
        <div class="list-item"><strong>Action</strong></div>
      </div>
      <div class="list-body"></div>
    </div>

    <script src="./data/countries_data.js"></script>
    <script src="./scripts/main.js"></script>
  </body>
</html>
